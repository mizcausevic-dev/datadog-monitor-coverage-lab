name: Deploy to ddmonitors.kineticgain.com

# Static HTML -> Hostinger FTP at /ddmonitors/
# workflow_dispatch-only: subdomain not yet in Hostinger DNS.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-datadog-monitor-coverage-lab
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP-sync to ddmonitors.kineticgain.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify build inputs
        run: |
          test -f index.html || (echo "FAIL: index.html missing" && exit 1)
          grep -q "Datadog Monitor Coverage Lab" index.html || (echo "FAIL: index.html missing title" && exit 1)
          echo "OK: verified"

      - name: FTP Deploy (attempt 1)
        id: ftp_first
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /ddmonitors/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            CHANGELOG.md
            LICENSE
            SECURITY.md
            CODE_OF_CONDUCT.md
            .gitignore

      - name: Sleep before retry (let FTP cap drain)
        if: steps.ftp_first.outcome == 'failure'
        run: sleep 60

      - name: Retry FTP Deploy if first attempt failed
        if: steps.ftp_first.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /ddmonitors/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            CHANGELOG.md
            LICENSE
            SECURITY.md
            CODE_OF_CONDUCT.md
            .gitignore
